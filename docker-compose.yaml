services:
  catalogue:
     build:
       dockerfile: catalogue.Dockerfile
     image: ravid145/catalogue:1.0.0
     container_name: catalogue
     depends_on:
     - mongodb

  mongodb: 
    build: 
      dockerfile: mongodb.Dockerfile # it moves to mongodb directory
    image: ravid145/mongodb:1.0.0 # docker build -t ravid145/mongodb:1.0.0
    container_name: mongodb

network:
  default:
    driver: bridge
    name: roboshop
    external: false # it it true you need to create network manullay
